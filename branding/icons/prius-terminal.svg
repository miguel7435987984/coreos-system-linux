<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Icon Shape -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#223249" stroke-width="3"/>

  <!-- Window Header Dots -->
  <circle cx="26" cy="26" r="4" fill="#ff5555"/>
  <circle cx="38" cy="26" r="4" fill="#f1fa8c"/>
  <circle cx="50" cy="26" r="4" fill="#50fa7b"/>

  <!-- Command Prompt Chevron >_ -->
  <path d="M 28 50 L 52 70 L 28 90" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cursor block -->
  <rect x="62" y="78" width="28" height="10" rx="3" fill="#00d2ff" filter="url(#glow)"/>

  <!-- Geminux emblem mini -->
  <circle cx="102" cy="26" r="5" fill="none" stroke="#00d2ff" stroke-width="2"/>
  <circle cx="102" cy="26" r="2" fill="#00d2ff"/>
</svg>
